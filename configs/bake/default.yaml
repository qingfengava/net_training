# Bake settings: canonical dataset -> Ultralytics pose images at the network input size.
# Everything is sampled per output image from a seed derived from (bake seed, sample id, copy), so the
# result does not depend on worker count or order. Unknown keys are an error.

size: [768, 576]        # width, height of the network input; must be 4:3 like the 1440x1080 camera
val_fraction: 0.1       # share of source samples that go to val, chosen by a hash of the sample id

roi:
  # sleepy runs the network on a tracker-guided ROI with the network's aspect ratio, or on the whole frame.
  full_frame_prob: 0.5
  armor_width_multiple: [4.0, 30.0]  # ROI width = target armor width in pixels x this, log-uniform
  min_width_px: 192
  max_width_px: 1440
  center_jitter: 0.3                 # target centre offset from the ROI centre, fraction of ROI size
  tries: 12
  # An armor that is cut by the ROI border so that this share of it remains is neither clearly in nor out.
  # The ROI is drawn again; after `tries` the whole frame is used.
  ambiguous_inside: [0.05, 0.6]
  tracker:
    # 默认关闭；实验配置开启。静态样本上的误差分布不等同于真实跟踪回放。
    prob: 0.0
    train_only: true
    search_prob: 0.35
    patrol_prob: 0.05
    recovery_prob: 0.20
    envelope_multiple: [2.0, 5.0]
    expand_ratio: 1.4
    base_expand_ratio: 3.0
    age_ms: [2.0, 20.0]
    recovery_age_ms: [20.0, 300.0]
    lost_time_ms: 1500.0
    center_sigma: 0.04
    recovery_sigma_per_s: 0.25
    velocity_error_frame_s: [0.0, 0.4]
    log_scale_sigma: 0.12

effects:
  gain: [0.5, 2.0]            # exposure in linear light, log-uniform
  black_level: [0.0, 0.015]   # veiling glare, linear light
  white_balance: [0.93, 1.07] # per channel gain; red versus blue stays recognizable
  bloom:
    prob: 0.7
    threshold: 0.6            # linear light
    sigma_px: [1.5, 6.0]
    strength: [0.1, 0.9]
  motion_blur:
    prob: 0.4
    length_px: [2, 9]
    # 缺少该字段的历史清单继续使用旧算法，保证历史审计逐像素复现。
    kernel: centered_v1
  defocus:
    prob: 0.4
    sigma_px: [0.4, 1.3]
  read_noise: [0.0, 0.012]    # sigma in linear light
  shot_noise: [0.0, 0.02]     # sigma = k * sqrt(signal), linear light
  flicker:
    # 全局快门下 LED 点阵的 PWM 频闪：每一行在曝光窗口里收到的光 = 方波的积分。默认关闭，等官方模块的刷新频率
    # 和扫描方式测出来再填 refresh_hz、duty、scan_span。曝光里恰好含整数个刷新周期时没有频闪（T×f 为整数）。
    prob: 0.0
    train_only: true
    refresh_hz: [240.0, 4000.0]   # 对数均匀；240 Hz 时 1.5 ms 曝光只含 0.36 个周期，条纹最重
    duty: [0.15, 0.9]             # PWM 亮的时间占周期的比例
    exposure_ms: [0.5, 3.5]       # sleepy 的自动曝光范围 0.1～3.5 ms，比赛常用 1.5～2 ms
    scan_span: [0.0, 1.0]         # 扫描一遍整屏占几个刷新周期；0 为所有行同步，1 为相位均匀铺满一个周期
    scan_direction: random        # down、up 或 random
    synchronized: false           # true：一帧里所有屏用同一个扫描相位
    frame_sigma: 0.0              # 整屏亮度因子的对数标准差；自动曝光会补偿平均亮度，默认不额外抖动
    grid_source: scene            # 行数来自场景里的点阵行数（scene），缺失时用 rows
    rows: 48
  bayer:
    # 让整帧走 RGGB 取样、8 位量化和双线性去马赛克（sleepy 对海康 BayerRG8 用 nppiCFAToRGB），
    # 点阵与滤色阵列相互混叠，产生亮度条纹和伪色。默认关闭。
    prob: 0.0
    train_only: true
    pattern: rggb
    demosaic: bilinear
  moire:
    # 点阵的空间采样模型，不模拟滚动快门或显示刷新。
    prob: 0.0
    train_only: true
    grid_source: scene
    grid: [64, 48]
    dot: square
    fill: [0.45, 0.85]
    strength: [0.15, 0.35]
    optical_sigma_px: [0.15, 0.45]
    pixel_aperture: [0.6, 1.0]
    harmonics: 3

distractors:
  # Armor-like things that are not armors: light bars, small LED panels, glowing blobs.
  prob: 0.3
  count: [1, 3]
  size_vs_armor: [0.3, 2.0]   # long side relative to the target armor width in pixels

lens:
  # Share of simulator frames that get a real lens's distortion (0 keeps bakes identical to the ones before this
  # option). configs/bake/lens.yaml turns it on. The cameras are sleepy's camera_info calibrations of the 1440x1080
  # auto-aim cameras (k1 k2 p1 p2 k3; fx fy cx cy in pixels, OpenCV pixel-centre convention).
  prob: 0.0
  cameras:
    - {dist: [-0.089138, 0.114766, 0.000034, 0.000238, 0.0], k: [1814.2, 1807.4, 730.3, 529.6], size: [1440, 1080]}  # omni, dong, eg, leg
    - {dist: [-0.06872, 0.11781, 0.000829, 0.000523, 0.0], k: [1812.6, 1810.5, 734.9, 531.8], size: [1440, 1080]}    # test, vo, wit
  scale: [0.5, 1.5]   # multiplies the coefficients, for lenses of the same kind that were not calibrated
