# 隧道关键点检测器数据集（相邻车道负样本，验证）。由 scripts/run_tunnel_det_dataset.sh 统一生成，
# 之后用 sleepy/tools/tunnel/daedalus_to_yolo.py 转成 YOLO 位姿格式。
out_dir = "/home/robo/net_training/runs/tunnel_det/det_val_neg"
seed = 2003
samples = 1
settle_frames = 3
timeout_frames = 600

[tunnel]
runs = 8
fps = 15.0
speed_mps = [1.0, 3.0]
yaw_sigma_deg = 6.0
lateral_m = 0.20
start_dist_m = 4.6
end_ref_dist_m = 0.2
pivot_height_m = [0.25, 0.55]
gimbal_track_noise_deg = 2.5
pitch_noise_deg = 2.0
roll_noise_deg = 2.0
dim_sigma_m = 0.0
dim_clip_m = 0.05
random_materials = true
lane_shift_m = [0.8, 1.3]
aim_at_tunnel = false

[light]
illuminance = [200.0, 1500.0]
elevation_deg = [25.0, 85.0]
