# Tiny Daedalus export used to check the pipeline end to end. See src/dataset/ in bevy_robomaster_simulator.
# Every key is optional; unknown keys are an error. Run with scripts/run_sim_dataset.sh.

out_dir = "/home/robo/net_training/runs/sim_m7"
seed = 11
samples = 3000
settle_frames = 4
timeout_frames = 300

[camera]
# vertical field of view, uniform. The main auto-aim cameras (sleepy camera_info, fy about 1810 px at 1080) are about
# 33 deg, the hero's (1040 px at 1024) about 52 deg; 35-55 before 2026-10-31 left the main lens out.
fov_y_deg = [30.0, 55.0]
distance_m = [1.0, 9.0]
height_m = [0.25, 1.8]
max_off_axis_deg = 70.0
frame_jitter = 0.6
roll_deg = 4.0

[light]
illuminance = [150.0, 1500.0]
elevation_deg = [25.0, 85.0]

[scene]
region_half_m = 2.5
region_center = [0.0, 0.0]
min_separation_m = 0.9
max_tilt_deg = 6.0
# share of samples aimed at an outpost armor and at a base armor; the rest aim at a robot
outpost_target_fraction = 0.12
base_target_fraction = 0.08

[labels]
min_visible_fraction = 0.35
ignore_below_fraction = 0.05
max_view_angle_deg = 75.0
depth_tolerance_m = 0.05
min_edge_px = 3.0

# RM27 dot-matrix armor (M7). On style day point screen_spec at the official spec; style = "legacy" (and no
# screen_spec) renders the light-bar armor again with the same robots, camera and light for this seed.
[armor]
style = "screen"
screen_spec = "../screens/rm27_hypothesis_a.toml"
